[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-swing"
version = "0.1.0"
description = "Reference swing-trend strategy with the full validation loop: signals, backtest with costs, overfit gates, verdict report"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["trading", "swing-trading", "trend-following", "backtest", "overfitting", "deflated-sharpe", "walk-forward"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trade-swing = "trade_swing.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/trade-swing"
Repository = "https://github.com/crieck2010/trade-swing"

[tool.setuptools.packages.find]
where = ["src"]
